<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="lotusTitle lotusDesc">
  <title id="lotusTitle">Light pink lotus flower</title>
  <desc id="lotusDesc">A stylized light pink lotus with layered petals and a soft yellow center.</desc>

  <defs>
    <linearGradient id="gBack" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffd6e7"/>
      <stop offset="100%" stop-color="#fff0f6"/>
    </linearGradient>

    <linearGradient id="gMid" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffc2da"/>
      <stop offset="100%" stop-color="#ffe6f0"/>
    </linearGradient>

    <linearGradient id="gInner" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffb7d5"/>
      <stop offset="100%" stop-color="#ffd6e7"/>
    </linearGradient>

    <radialGradient id="gCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff4cc"/>
      <stop offset="70%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#f4a261"/>
    </radialGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#d95a93" flood-opacity="0.18"/>
    </filter>

    <path id="petal" d="M0 0 C-52 -45 -82 -125 -62 -215 C-46 -285 -22 -325 0 -344 C22 -325 46 -285 62 -215 C82 -125 52 -45 0 0Z"/>
    <path id="petalVein" d="M0 -15 C-6 -80 -6 -180 0 -310" fill="none" stroke-linecap="round"/>
  </defs>

  <g filter="url(#softShadow)">
    <!-- Back petals -->
    <g transform="translate(256 420)">
      <use href="#petal" fill="url(#gBack)" transform="rotate(-75) scale(0.70)"/>
      <use href="#petal" fill="url(#gBack)" transform="rotate(-50) scale(0.82)"/>
      <use href="#petal" fill="url(#gBack)" transform="rotate(-25) scale(0.92)"/>
      <use href="#petal" fill="url(#gBack)" transform="rotate(0) scale(0.98)"/>
      <use href="#petal" fill="url(#gBack)" transform="rotate(25) scale(0.92)"/>
      <use href="#petal" fill="url(#gBack)" transform="rotate(50) scale(0.82)"/>
      <use href="#petal" fill="url(#gBack)" transform="rotate(75) scale(0.70)"/>
    </g>

    <!-- Mid petals -->
    <g transform="translate(256 420)">
      <use href="#petal" fill="url(#gMid)" transform="rotate(-55) scale(0.72)"/>
      <use href="#petal" fill="url(#gMid)" transform="rotate(-28) scale(0.82)"/>
      <use href="#petal" fill="url(#gMid)" transform="rotate(0) scale(0.86)"/>
      <use href="#petal" fill="url(#gMid)" transform="rotate(28) scale(0.82)"/>
      <use href="#petal" fill="url(#gMid)" transform="rotate(55) scale(0.72)"/>
    </g>

    <!-- Mid petal veins -->
    <g transform="translate(256 420)">
      <use href="#petalVein" stroke="#ffffff" stroke-width="3" opacity="0.35" transform="rotate(-55) scale(0.72)"/>
      <use href="#petalVein" stroke="#ffffff" stroke-width="3" opacity="0.35" transform="rotate(-28) scale(0.82)"/>
      <use href="#petalVein" stroke="#ffffff" stroke-width="3" opacity="0.35" transform="rotate(0) scale(0.86)"/>
      <use href="#petalVein" stroke="#ffffff" stroke-width="3" opacity="0.35" transform="rotate(28) scale(0.82)"/>
      <use href="#petalVein" stroke="#ffffff" stroke-width="3" opacity="0.35" transform="rotate(55) scale(0.72)"/>
    </g>

    <!-- Inner petals -->
    <g transform="translate(256 420)">
      <use href="#petal" fill="url(#gInner)" transform="rotate(-38) scale(0.56)"/>
      <use href="#petal" fill="url(#gInner)" transform="rotate(-13) scale(0.62)"/>
      <use href="#petal" fill="url(#gInner)" transform="rotate(13) scale(0.62)"/>
      <use href="#petal" fill="url(#gInner)" transform="rotate(38) scale(0.56)"/>
    </g>

    <!-- Inner petal veins -->
    <g transform="translate(256 420)">
      <use href="#petalVein" stroke="#ffffff" stroke-width="2.5" opacity="0.4" transform="rotate(-38) scale(0.56)"/>
      <use href="#petalVein" stroke="#ffffff" stroke-width="2.5" opacity="0.4" transform="rotate(-13) scale(0.62)"/>
      <use href="#petalVein" stroke="#ffffff" stroke-width="2.5" opacity="0.4" transform="rotate(13) scale(0.62)"/>
      <use href="#petalVein" stroke="#ffffff" stroke-width="2.5" opacity="0.4" transform="rotate(38) scale(0.56)"/>
    </g>

    <!-- Center -->
    <g transform="translate(256 420)">
      <ellipse cx="0" cy="-8" rx="22" ry="16" fill="url(#gCenter)"/>
      <circle cx="0" cy="-14" r="6" fill="#fff4cc" opacity="0.9"/>
      <circle cx="-10" cy="-18" r="3.5" fill="#ffd166"/>
      <circle cx="10" cy="-18" r="3.5" fill="#ffd166"/>
      <circle cx="-16" cy="-8" r="3" fill="#ffd166"/>
      <circle cx="16" cy="-8" r="3" fill="#ffd166"/>
      <circle cx="0" cy="-24" r="4" fill="#ffd166"/>
    </g>
  </g>
</svg>