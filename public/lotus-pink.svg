<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Light pink lotus flower">
  <defs>
    <linearGradient id="lotusBack" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"  stop-color="#FFD7E7"/>
      <stop offset="100%" stop-color="#FFF2F8"/>
    </linearGradient>
    <linearGradient id="lotusMid" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"  stop-color="#FBBFD8"/>
      <stop offset="100%" stop-color="#FFEAF3"/>
    </linearGradient>
    <linearGradient id="lotusFront" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"  stop-color="#F6A6C7"/>
      <stop offset="100%" stop-color="#FFDDEC"/>
    </linearGradient>
    <radialGradient id="lotusCore" cx="50%" cy="60%" r="60%">
      <stop offset="0%"  stop-color="#FFF8FB"/>
      <stop offset="100%" stop-color="#F8C3DA"/>
    </radialGradient>
  </defs>

  <!-- soft water ripples -->
  <g stroke="#FBD3E4" stroke-linecap="round" fill="none" opacity=".9">
    <path d="M44 152h30"  stroke-width="3"/>
    <path d="M126 152h30" stroke-width="3"/>
    <path d="M58 162h24"  stroke-width="2.5" opacity=".7"/>
    <path d="M118 162h24" stroke-width="2.5" opacity=".7"/>
  </g>

  <!-- BACK PETALS -->
  <g fill="url(#lotusBack)" stroke="#F8C6DC" stroke-width="2" stroke-linejoin="round">
    <path d="M100 140C76 118 74 80 100 52C126 80 124 118 100 140Z" transform="rotate(-78 100 140)"/>
    <path d="M100 140C76 118 74 80 100 52C126 80 124 118 100 140Z" transform="rotate(78 100 140)"/>
    <path d="M100 140C76 118 74 80 100 52C126 80 124 118 100 140Z" transform="rotate(-52 100 140)"/>
    <path d="M100 140C76 118 74 80 100 52C126 80 124 118 100 140Z" transform="rotate(52 100 140)"/>
  </g>

  <!-- MIDDLE PETALS -->
  <g fill="url(#lotusMid)" stroke="#F6B6D1" stroke-width="2" stroke-linejoin="round">
    <path d="M100 140C72 115 70 70 100 38C130 70 128 115 100 140Z" transform="rotate(-36 100 140)"/>
    <path d="M100 140C72 115 70 70 100 38C130 70 128 115 100 140Z" transform="rotate(36 100 140)"/>
  </g>

  <!-- FRONT PETALS -->
  <g fill="url(#lotusFront)" stroke="#EE9DBF" stroke-width="2" stroke-linejoin="round">
    <path d="M100 140C72 115 70 70 100 38C130 70 128 115 100 140Z" transform="rotate(-19 100 140)"/>
    <path d="M100 140C72 115 70 70 100 38C130 70 128 115 100 140Z" transform="rotate(19 100 140)"/>
    <path d="M100 140C78 112 76 64 100 28C124 64 122 112 100 140Z"/>
  </g>

  <!-- centre petal crease -->
  <path d="M100 134V48" stroke="#FBC8DC" stroke-width="2" stroke-linecap="round" opacity=".85" fill="none"/>

  <!-- flower heart -->
  <ellipse cx="100" cy="137" rx="17" ry="9" fill="url(#lotusCore)"/>
  <g fill="#F7B9D2">
    <circle cx="92" cy="135" r="2"/>
    <circle cx="100" cy="133.5" r="2.2"/>
    <circle cx="108" cy="135" r="2"/>
  </g>
</svg>